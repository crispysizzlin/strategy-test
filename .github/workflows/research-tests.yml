name: research-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-accounting-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free test suite
        run: PYTHONPATH=research python -m unittest discover -s tests -v
